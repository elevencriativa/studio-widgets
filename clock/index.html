<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Relógio do Studio</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Space+Grotesk:wght@500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --bg-1: #f6f1ff;
    --bg-2: #fff4ea;
    --ink: #1d1530;
    --ink-soft: #6b6280;
    --accent: #7c3aed;
    --ring: rgba(124, 58, 237, .14);
  }
  :root[data-tema="escuro"] {
    --bg-1: #1b1530;
    --bg-2: #2a1a24;
    --ink: #f5f1ff;
    --ink-soft: #a99fc2;
    --accent: #c4a5ff;
    --ring: rgba(196, 165, 255, .18);
  }
  * { box-sizing: border-box; margin: 0; }
  html, body { height: 100%; }
  body {
    font-family: "Inter", system-ui, sans-serif;
    color: var(--ink);
    background: linear-gradient(135deg, var(--bg-1), var(--bg-2));
    display: grid;
    place-items: center;
    overflow: hidden;
  }
  .clock {
    display: flex;
    align-items: center;
    gap: clamp(16px, 4vw, 40px);
    padding: 16px;
  }
  .dial {
    width: clamp(64px, 18vh, 120px);
    aspect-ratio: 1;
    border-radius: 50%;
    position: relative;
    background: radial-gradient(circle at 30% 30%, #fff8, transparent 60%), var(--ring);
    box-shadow: inset 0 0 0 1.5px var(--ring);
    flex: none;
  }
  .hand {
    position: absolute;
    left: 50%;
    bottom: 50%;
    transform-origin: 50% 100%;
    border-radius: 4px;
    background: var(--ink);
  }
  .h { width: 4px; height: 26%; margin-left: -2px; }
  .m { width: 3px; height: 36%; margin-left: -1.5px; opacity: .85; }
  .s { width: 1.5px; height: 40%; margin-left: -.75px; background: var(--accent); }
  .pin {
    position: absolute; inset: 50% auto auto 50%;
    width: 8px; height: 8px; margin: -4px 0 0 -4px;
    border-radius: 50%; background: var(--accent);
  }
  .time {
    font-family: "Space Grotesk", "Inter", sans-serif;
    font-weight: 600;
    font-size: clamp(40px, 16vh, 96px);
    letter-spacing: -0.03em;
    line-height: 1;
    font-variant-numeric: tabular-nums;
  }
  .time .sec {
    font-size: .38em;
    color: var(--accent);
    margin-left: .15em;
    vertical-align: .9em;
  }
  .meta {
    margin-top: 8px;
    font-size: clamp(12px, 3.4vh, 17px);
    color: var(--ink-soft);
    font-weight: 500;
  }
  .meta b { color: var(--ink); font-weight: 600; }
  @media (max-width: 380px) { .dial { display: none; } }
</style>
</head>
<body>
  <div class="clock">
    <div class="dial" aria-hidden="true">
      <div class="hand h" id="h"></div>
      <div class="hand m" id="m"></div>
      <div class="hand s" id="s"></div>
      <div class="pin"></div>
    </div>
    <div>
      <div class="time" id="time">--:--<span class="sec">--</span></div>
      <div class="meta"><b id="greet">Olá</b> · <span id="date"></span></div>
    </div>
  </div>
<script>
  // ?tema=escuro deixa o widget escuro; ?fuso= troca o fuso (padrão: Brasília)
  const params = new URLSearchParams(location.search);
  if (params.get("tema") === "escuro") document.documentElement.dataset.tema = "escuro";
  const timeZone = params.get("fuso") || "America/Sao_Paulo";

  const parts = (d) => Object.fromEntries(
    new Intl.DateTimeFormat("pt-BR", {
      timeZone, hour: "2-digit", minute: "2-digit", second: "2-digit", hour12: false
    }).formatToParts(d).map((p) => [p.type, p.value])
  );
  const dateFmt = new Intl.DateTimeFormat("pt-BR", {
    timeZone, weekday: "long", day: "numeric", month: "long"
  });

  function tick() {
    const now = new Date();
    const { hour, minute, second } = parts(now);
    const h = +hour, m = +minute, s = +second;
    document.getElementById("time").innerHTML = `${hour}:${minute}<span class="sec">${second}</span>`;
    document.getElementById("date").textContent = dateFmt.format(now);
    document.getElementById("greet").textContent = h < 12 ? "Bom dia" : h < 18 ? "Boa tarde" : "Boa noite";
    document.getElementById("h").style.transform = `rotate(${(h % 12) * 30 + m * 0.5}deg)`;
    document.getElementById("m").style.transform = `rotate(${m * 6 + s * 0.1}deg)`;
    document.getElementById("s").style.transform = `rotate(${s * 6}deg)`;
  }
  tick();
  setInterval(tick, 1000);
</script>
</body>
</html>
