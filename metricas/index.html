<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Métricas de entrega</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Space+Grotesk:wght@500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #faf8ff;
    --card: #ffffff;
    --line: #ece8f5;
    --ink: #1d1530;
    --ink-soft: #6b6280;
    --aprovado: #16a36a;
    --ajustes: #f2a516;
    --reprovado: #e5484d;
    --aguardando: #b9b3c8;
    --accent: #7c3aed;
  }
  :root[data-tema="escuro"] {
    --bg: #151022;
    --card: #1f1830;
    --line: #30284a;
    --ink: #f5f1ff;
    --ink-soft: #a99fc2;
    --aguardando: #5d5576;
    --accent: #c4a5ff;
  }
  * { box-sizing: border-box; margin: 0; }
  body {
    font-family: "Inter", system-ui, sans-serif;
    background: var(--bg);
    color: var(--ink);
    padding: 16px;
  }
  .grid {
    display: grid;
    gap: 14px;
    grid-template-columns: repeat(4, 1fr);
    max-width: 1100px;
    margin: 0 auto;
  }
  .card {
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: 16px;
    padding: 18px;
  }
  .kpi .label { font-size: 13px; color: var(--ink-soft); font-weight: 500; }
  .kpi .value {
    font-family: "Space Grotesk", sans-serif;
    font-size: 34px;
    font-weight: 600;
    letter-spacing: -0.02em;
    margin-top: 6px;
    font-variant-numeric: tabular-nums;
  }
  .kpi .dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; margin-right: 6px; vertical-align: 1px; }
  .hero { grid-column: span 2; display: flex; align-items: center; gap: 22px; }
  .hero .value { font-size: 52px; color: var(--aprovado); }
  .hero .sub { font-size: 13px; color: var(--ink-soft); margin-top: 4px; }
  .wide { grid-column: span 2; }
  h2 { font-size: 14px; font-weight: 600; margin-bottom: 14px; }
  .donut-wrap { display: flex; align-items: center; gap: 22px; }
  .legend { list-style: none; padding: 0; display: grid; gap: 8px; font-size: 13px; }
  .legend li { display: flex; align-items: center; gap: 8px; color: var(--ink-soft); }
  .legend b { color: var(--ink); font-weight: 600; margin-left: auto; padding-left: 12px; font-variant-numeric: tabular-nums; }
  .legend i { width: 10px; height: 10px; border-radius: 3px; flex: none; }
  .bars { display: flex; align-items: flex-end; gap: 14px; height: 170px; padding-top: 8px; }
  .bar { flex: 1; display: flex; flex-direction: column; align-items: center; gap: 6px; height: 100%; justify-content: flex-end; min-width: 0; }
  .stack { width: 100%; max-width: 44px; display: flex; flex-direction: column-reverse; border-radius: 8px; overflow: hidden; }
  .stack span { display: block; transition: height .6s ease; }
  .bar small { font-size: 11px; color: var(--ink-soft); white-space: nowrap; }
  .bar .n { font-size: 12px; font-weight: 600; }
  .empty { color: var(--ink-soft); font-size: 13px; padding: 40px 0; text-align: center; }
  footer { max-width: 1100px; margin: 12px auto 0; font-size: 12px; color: var(--ink-soft); text-align: right; }
  @media (max-width: 760px) {
    .grid { grid-template-columns: repeat(2, 1fr); }
    .hero, .wide { grid-column: span 2; }
  }
</style>
</head>
<body>
  <main class="grid">
    <section class="card kpi hero">
      <svg width="88" height="88" viewBox="0 0 36 36" aria-hidden="true">
        <circle cx="18" cy="18" r="15.9" fill="none" stroke="var(--line)" stroke-width="3.2"/>
        <circle id="rateRing" cx="18" cy="18" r="15.9" fill="none" stroke="var(--aprovado)" stroke-width="3.2"
          stroke-linecap="round" stroke-dasharray="0 100" transform="rotate(-90 18 18)"/>
      </svg>
      <div>
        <div class="label">Taxa de aprovação</div>
        <div class="value" id="rate">–</div>
        <div class="sub">aprovadas (com ou sem ajustes) ÷ apresentações com retorno</div>
      </div>
    </section>
    <section class="card kpi"><div class="label">Apresentações</div><div class="value" id="total">–</div></section>
    <section class="card kpi"><div class="label"><span class="dot" style="background:var(--aguardando)"></span>Aguardando retorno</div><div class="value" id="aguardando">–</div></section>

    <section class="card wide">
      <h2>Aprovação x reprovação</h2>
      <div class="donut-wrap">
        <svg id="donut" width="150" height="150" viewBox="0 0 42 42" aria-label="Distribuição dos resultados"></svg>
        <ul class="legend" id="legend"></ul>
      </div>
    </section>
    <section class="card wide">
      <h2>Por mês</h2>
      <div class="bars" id="bars"></div>
    </section>
  </main>
  <footer id="updated"></footer>

<script>
  const params = new URLSearchParams(location.search);
  if (params.get("tema") === "escuro") document.documentElement.dataset.tema = "escuro";

  const KEYS = [
    ["aprovado", "Aprovado"],
    ["ajustes", "Aprovado com ajustes"],
    ["reprovado", "Reprovado"],
    ["aguardando", "Aguardando retorno"],
  ];
  const color = (k) => `var(--${k})`;
  const MONTHS = ["jan", "fev", "mar", "abr", "mai", "jun", "jul", "ago", "set", "out", "nov", "dez"];

  function renderDonut(t) {
    const svg = document.getElementById("donut");
    const total = KEYS.reduce((a, [k]) => a + t[k], 0);
    let offset = 25, html = `<circle cx="21" cy="21" r="15.9" fill="none" stroke="var(--line)" stroke-width="5"/>`;
    if (total) {
      for (const [k] of KEYS) {
        const pct = (t[k] / total) * 100;
        if (!pct) continue;
        html += `<circle cx="21" cy="21" r="15.9" fill="none" stroke="${color(k)}" stroke-width="5"
          stroke-dasharray="${pct} ${100 - pct}" stroke-dashoffset="${offset}"/>`;
        offset -= pct;
      }
    }
    html += `<text x="21" y="22.5" text-anchor="middle" font-size="7" font-weight="600"
      font-family="Space Grotesk" fill="var(--ink)">${total}</text>`;
    svg.innerHTML = html;
    document.getElementById("legend").innerHTML = KEYS.map(([k, label]) =>
      `<li><i style="background:${color(k)}"></i>${label}<b>${t[k]}</b></li>`).join("");
  }

  function renderBars(byMonth) {
    const el = document.getElementById("bars");
    if (!byMonth.length) { el.innerHTML = `<div class="empty">Ainda sem apresentações com data.</div>`; return; }
    const max = Math.max(...byMonth.map((m) => KEYS.reduce((a, [k]) => a + m[k], 0)));
    el.innerHTML = byMonth.slice(-8).map((m) => {
      const sum = KEYS.reduce((a, [k]) => a + m[k], 0);
      const [y, mo] = m.month.split("-");
      const segs = KEYS.map(([k]) => m[k]
        ? `<span style="height:${(m[k] / max) * 130}px;background:${color(k)}"></span>` : "").join("");
      return `<div class="bar"><span class="n">${sum}</span><div class="stack">${segs}</div>
        <small>${MONTHS[+mo - 1]}/${y.slice(2)}</small></div>`;
    }).join("");
  }

  async function load() {
    const res = await fetch(`data.json?t=${Date.now()}`, { cache: "no-store" });
    const d = await res.json();
    const t = d.totals;
    const answered = t.aprovado + t.ajustes + t.reprovado;
    const rate = answered ? Math.round(((t.aprovado + t.ajustes) / answered) * 100) : null;
    document.getElementById("rate").textContent = rate === null ? "–" : `${rate}%`;
    document.getElementById("rateRing").setAttribute("stroke-dasharray", `${rate || 0} 100`);
    document.getElementById("total").textContent = answered + t.aguardando;
    document.getElementById("aguardando").textContent = t.aguardando;
    renderDonut(t);
    renderBars(d.byMonth);
    const when = new Date(d.updatedAt).toLocaleString("pt-BR", {
      timeZone: "America/Sao_Paulo", day: "2-digit", month: "2-digit", hour: "2-digit", minute: "2-digit"
    });
    document.getElementById("updated").textContent = `Atualizado em ${when} · dados do Notion`;
  }
  load();
  setInterval(load, 10 * 60 * 1000);
</script>
</body>
</html>
