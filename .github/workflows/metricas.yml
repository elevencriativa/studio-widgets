name: Atualizar métricas

on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  atualizar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Ler o Notion e gerar data.json
        env:
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
        run: node scripts/build-metrics.mjs
      - name: Publicar se mudou
        run: |
          git config user.name "studio-metricas"
          git config user.email "actions@users.noreply.github.com"
          git add metricas/data.json
          git diff --cached --quiet -- metricas/data.json && exit 0
          git commit -m "Atualiza métricas de entrega"
          git push
